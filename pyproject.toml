[project]
name = "hihydrosoil-data"
version = "0.1.0"
description = "HiHydroSoil v2.0 local GeoTIFFs to Icechunk Zarr on Source Cooperative"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "icechunk>=2.1", "zarr>=3.3", "xarray>=2026.7.0", "rasterio>=1.5.0",
    "numpy>=2.0", "polars>=1.43.0", "pyarrow>=25.0.0", "pyproj>=3.7",
    "pydantic>=2.10", "typer>=0.15", "boto3>=1.43", "tqdm>=4.69.0",
    "topozarr==0.1.6",
]

[project.scripts]
hihydrosoil = "hihydrosoil.cli:app"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hihydrosoil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
